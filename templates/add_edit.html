{% extends "base.html" %}
{% block content %}

<h2>{{ "Edit Book" if book else "Add a Book" }}</h2>

<form method="post" class="form-card">
    <label>Title <input name="title" required value="{{ book.title if book else '' }}"></label>
    <label>Author <input name="author" required value="{{ book.author if book else '' }}"></label>
    <label>Series <input name="series_name" value="{{ book.series_name if book else '' }}"></label>
    <label>Series Position <input type="number" name="series_position" value="{{ book.series_position if book else '' }}"></label>

    <label>Reading Status
        <select name="reading_status">
            {% for status in ['not read','reading','finished','dnf'] %}
                <option value="{{ status }}" {% if book and book.reading_status.value == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Ownership Status
        <select name="ownership_status">
            {% for status in ['owned','not owned','want'] %}
                <option value="{{ status }}" {% if book and book.ownership_status.value == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </label>

    <label>Rating <input type="number" min="1" max="5" name="rating" value="{{ book.rating if book and book.rating else '' }}"></label>
    <label>Tags <input name="tags" value="{% if book %}{% for tag in book.tags %}{{ tag.name }}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}"></label>
    <label>Albums <input name="albums" value="{% if book %}{{ book.albums|join(', ') }}{% endif %}"></label>
    <small>Separate tags and album names with commas. A book can belong to multiple albums.</small>

    <button class="button" type="submit">Save</button>
</form>

{% endblock %}
